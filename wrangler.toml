# wrangler.toml — Cloudflare Workers configuration.
#
# Local dev:  npx wrangler dev --local         (no Cloudflare account needed;
#             R2/cron bindings are simulated on disk under .wrangler/state)
# Deploy:     npx wrangler deploy --env staging | --env production
# Secrets:    local  → .dev.vars (gitignored; template in .dev.vars.example)
#             remote → npx wrangler secret put <NAME> --env <staging|production>
#
# With nodejs_compat and a 2025+ compatibility_date, the runtime populates
# process.env from [vars] + secrets, so existing `process.env.X` reads in
# src/node keep working unchanged.

name = "outdream-backend"
main = "src/node/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs.
[observability]
enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# Cron Triggers — ONE daily maintenance trigger (UTC, off-peak) that runs both
# jobs (idempotency-key cleanup + 7-year audit-log pruning) via the merged
# handler in src/node/cron.ts. Kept to a single trigger because Cloudflare caps
# cron triggers per account — one per environment keeps multi-project accounts
# under the limit. The expression is the DISPATCH KEY: it must exactly match a
# key of `cronRegistry` in src/node/cron.ts (guarded by tests/unit/cron.test.ts).
# [triggers] IS inherited by [env.*] blocks, so it is declared once here.
# Test locally: wrangler dev --local --test-scheduled, then
#   curl "http://localhost:8787/__scheduled?cron=0+4+*+*+*"
# ─────────────────────────────────────────────────────────────────────────────
[triggers]
crons = [
  "0 4 * * *", # daily maintenance — janitor + audit-retention (see cron.ts)
]

# ─────────────────────────────────────────────────────────────────────────────
# Non-secret runtime config — see docs/ENVIRONMENT_VARIABLES.md. SECRETS NEVER
# GO HERE (DATABASE_URL,
# WORKOS_CLIENT_ID, etc. → .dev.vars locally, `wrangler secret put` deployed).
# NOTE: [vars] and [[r2_buckets]] are NOT inherited by named environments —
# they are repeated in full under [env.staging] / [env.production] below.
# This top-level block is what `wrangler dev --local` uses.
# ─────────────────────────────────────────────────────────────────────────────
[vars]
NODE_ENV = "development"
STAGE = "local"
PROJECT_NAME = "outdream"                   # PLACEHOLDER: project identifier
API_VERSION = "v1"
# CORS (see src/node/lib/cors.ts)
CORS_DOMAIN_PATTERNS = ""                       # PLACEHOLDER: wildcard/parent domains, comma-separated (not regex)
CORS_EXACT_ORIGINS = "http://localhost:3000"    # PLACEHOLDER: exact origins, comma-separated
CORS_PARENT_DOMAINS = ""                        # PLACEHOLDER: parent domains, comma-separated
# Media — IMAGES_BUCKET must match [[r2_buckets]].bucket_name below; the CDN
# URL is the R2 public/custom-domain URL.
IMAGES_BUCKET = "outdream-images-local"
IMAGES_CDN_URL = "https://images-local.outdream.party"

# R2 media storage. Route code reaches it as c.env.IMAGES
# (see src/node/worker.ts WorkerBindings). `wrangler dev --local` simulates the
# bucket on disk; the name does not need to exist on a real account.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "outdream-images-local"       # PLACEHOLDER: local-sim name, anything works

# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Queues — WorkOS webhook ingest/processing. The HTTP route
# (routes/webhooks.ts) verifies + enqueues onto
# WEBHOOK_QUEUE; `worker.queue` (src/node/queue.ts) consumes. The binding name
# is WEBHOOK_QUEUE in every environment. Local queues are SIMULATED on disk by
# `wrangler dev --local` (no Cloudflare account / no real queue needed); the
# route also falls back to inline processing when the binding is absent.
# ─────────────────────────────────────────────────────────────────────────────
[[queues.producers]]
queue = "outdream-webhooks-local"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "outdream-webhooks-local"

# Per-IP rate limiting — Workers Rate Limiting binding (RATE_LIMITER; no
# dashboard resource needed). Top-level/local; repeated per env below.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }


# ─────────────────────────────────────────────────────────────────────────────
# Staging
# Required secrets (set once): npx wrangler secret put DATABASE_URL --env staging
# (repeat for every secret listed in .dev.vars.example)
# ─────────────────────────────────────────────────────────────────────────────
[env.staging]

[env.staging.vars]
NODE_ENV = "staging"
STAGE = "staging"
PROJECT_NAME = "outdream"                   # PLACEHOLDER: project identifier
API_VERSION = "v1"
SENTRY_ENVIRONMENT = "staging"
CORS_DOMAIN_PATTERNS = ""                       # PLACEHOLDER
CORS_EXACT_ORIGINS = "https://staging.outdream.party" # PLACEHOLDER: e.g. https://staging.yourdomain.com
CORS_PARENT_DOMAINS = ""                        # PLACEHOLDER
IMAGES_BUCKET = "outdream-images-staging"   # PLACEHOLDER: must match the R2 bucket below
IMAGES_CDN_URL = "https://images-staging.outdream.party"

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "outdream-images-staging"     # PLACEHOLDER: create with `wrangler r2 bucket create`

# Queues (staging) — create before the first staging deploy:
#   wrangler queues create <project>-webhooks-staging
#   wrangler queues create <project>-webhooks-dlq-staging
# Producer + main consumer (with DLQ routing), then a consumer that DRAINS the
# DLQ — both land in `handleQueueBatch`, which branches on `batch.queue`.
[[env.staging.queues.producers]]
queue = "outdream-webhooks-staging"
binding = "WEBHOOK_QUEUE"

[[env.staging.queues.consumers]]
queue = "outdream-webhooks-staging"
max_retries = 5
dead_letter_queue = "outdream-webhooks-dlq-staging"

[[env.staging.queues.consumers]]
queue = "outdream-webhooks-dlq-staging"
# Terminal-failure persistence gets a long, bounded retry window. With no
# downstream DLQ, Cloudflare discards after max_retries, so alerts must page.
max_retries = 100
retry_delay = 900

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

# >>> set-domain (managed by scripts/set-domain.ts) — staging API custom domain
[[env.staging.routes]]
pattern = "api-staging.outdream.party"
custom_domain = true
# <<< set-domain

# ─────────────────────────────────────────────────────────────────────────────
# Production
# Required secrets (set once): npx wrangler secret put DATABASE_URL --env production
# (repeat for every secret listed in .dev.vars.example)
# ─────────────────────────────────────────────────────────────────────────────
[env.production]

[env.production.vars]
NODE_ENV = "production"
STAGE = "production"
PROJECT_NAME = "outdream"                   # PLACEHOLDER: project identifier
API_VERSION = "v1"
SENTRY_ENVIRONMENT = "production"
CORS_DOMAIN_PATTERNS = ""                       # PLACEHOLDER
CORS_EXACT_ORIGINS = "https://outdream.party" # PLACEHOLDER: e.g. https://yourdomain.com
CORS_PARENT_DOMAINS = ""                        # PLACEHOLDER
IMAGES_BUCKET = "outdream-images-production" # PLACEHOLDER: must match the R2 bucket below
IMAGES_CDN_URL = "https://images.outdream.party"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "outdream-images-production"  # PLACEHOLDER: create with `wrangler r2 bucket create`

# Queues (production) — create before the first production deploy:
#   wrangler queues create <project>-webhooks-production
#   wrangler queues create <project>-webhooks-dlq-production
# Producer + main consumer (with DLQ routing), then a consumer that DRAINS the
# DLQ — both land in `handleQueueBatch`, which branches on `batch.queue`.
[[env.production.queues.producers]]
queue = "outdream-webhooks-production"
binding = "WEBHOOK_QUEUE"

[[env.production.queues.consumers]]
queue = "outdream-webhooks-production"
max_retries = 5
dead_letter_queue = "outdream-webhooks-dlq-production"

[[env.production.queues.consumers]]
queue = "outdream-webhooks-dlq-production"
# Terminal-failure persistence gets a long, bounded retry window. With no
# downstream DLQ, Cloudflare discards after max_retries, so alerts must page.
max_retries = 100
retry_delay = 900

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 100, period = 60 }

# >>> set-domain (managed by scripts/set-domain.ts) — production API custom domain
[[env.production.routes]]
pattern = "api.outdream.party"
custom_domain = true
# <<< set-domain
